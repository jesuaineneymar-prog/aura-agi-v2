plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.jc.aura'
    compileSdk 34

    defaultConfig {
        applicationId "com.jc.aura"
        minSdk 29
        targetSdk 34
        versionCode 1
        versionName "3.0.0-Aura"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // API Keys injected via environment variables
        buildConfigField "String", "OPENROUTER_KEY", "\"${project.findProperty('OPENROUTER_KEY') ?: ''}\""
        buildConfigField "String", "GEMINI_KEY", "\"${project.findProperty('GEMINI_KEY') ?: ''}\""
        buildConfigField "String", "AUDIOLAB_KEY", "\"${project.findProperty('AUDIOLAB_KEY') ?: ''}\""
        buildConfigField "String", "WEATHER_KEY", "\"${project.findProperty('WEATHER_KEY') ?: ''}\""
        buildConfigField "String", "EXCHANGE_KEY", "\"${project.findProperty('EXCHANGE_KEY') ?: ''}\""
        buildConfigField "String", "DEEPSEEK_KEY", "\"${project.findProperty('DEEPSEEK_KEY') ?: ''}\""
        buildConfigField "String", "GLM_KEY", "\"${project.findProperty('GLM_KEY') ?: ''}\""
        buildConfigField "String", "MOONSHOT_KEY", "\"${project.findProperty('MOONSHOT_KEY') ?: ''}\""
        buildConfigField "String", "QWEN_IMAGE_KEY", "\"${project.findProperty('QWEN_IMAGE_KEY') ?: ''}\""
        buildConfigField "String", "LLAMA_KEY", "\"${project.findProperty('LLAMA_KEY') ?: ''}\""
    }

    signingConfigs {
        release {
            if (System.getenv("KEYSTORE_FILE") != null) {
                storeFile file(System.getenv("KEYSTORE_FILE") ?: "keystore.jks")
                storePassword System.getenv("KEYSTORE_PASSWORD") ?: ""
                keyAlias System.getenv("KEY_ALIAS") ?: ""
                keyPassword System.getenv("KEY_PASSWORD") ?: ""
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (System.getenv("KEYSTORE_FILE") != null) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            minifyEnabled false
            applicationIdSuffix ".debug"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }
    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    // Kotlin Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3'

    // Android Core
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // Lifecycle
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-service:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'

    // CameraX
    implementation 'androidx.camera:camera-core:1.3.1'
    implementation 'androidx.camera:camera-camera2:1.3.1'
    implementation 'androidx.camera:camera-lifecycle:1.3.1'
    implementation 'androidx.camera:camera-view:1.3.1'

    // ML Kit - Face Detection
    implementation 'com.google.mlkit:face-detection:16.1.5'

    // WebSocket
    implementation 'org.java-websocket:Java-WebSocket:1.5.4'

    // JSON
    implementation 'org.json:json:20231013'

    // Image loading
    implementation 'com.github.bumptech.glide:glide:4.16.0'

    // Work Manager (background tasks)
    implementation 'androidx.work:work-runtime-ktx:2.9.0'

    // SQLite (via Room or direct)
    implementation 'androidx.sqlite:sqlite-ktx:2.4.0'

    // Security - EncryptedSharedPreferences
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'

    // Testing
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
