name: Build Aura APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Dar permissão ao Gradle
        run: chmod +x gradlew

      - name: Add API keys to gradle.properties
        run: |
          echo "OPENROUTER_KEY=${{ secrets.OPENROUTER_KEY }}" >> gradle.properties
          echo "GEMINI_KEY=${{ secrets.GEMINI_KEY }}" >> gradle.properties
          echo "ELEVENLABS_KEY=${{ secrets.ELEVENLABS_KEY }}" >> gradle.properties
          echo "VOICE_ID=${{ secrets.VOICE_ID }}" >> gradle.properties
          echo "WEATHER_KEY=${{ secrets.WEATHER_KEY }}" >> gradle.properties
          echo "EXCHANGE_KEY=${{ secrets.EXCHANGE_KEY }}" >> gradle.properties
          echo "DEEPSEEK_KEY=${{ secrets.DEEPSEEK_KEY }}" >> gradle.properties
          echo "GLM_KEY=${{ secrets.GLM_KEY }}" >> gradle.properties
          echo "MOONSHOT_KEY=${{ secrets.MOONSHOT_KEY }}" >> gradle.properties
          echo "QWEN_IMAGE_KEY=${{ secrets.QWEN_IMAGE_KEY }}" >> gradle.properties
          echo "LLAMA_KEY=${{ secrets.LLAMA_KEY }}" >> gradle.properties

      - name: Compilar APK Debug
        run: ./gradlew :app:assembleDebug

      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: Aura-DEBUG-APK
          path: app/build/outputs/apk/debug/app-debug.apk
