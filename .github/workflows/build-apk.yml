name: Build Aura APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Dar permissão ao Gradle
        run: chmod +x gradlew

      - name: Create gradle.properties with secrets
        run: |
          cat > gradle.properties << 'EOF'
          OPENROUTER_KEY=${{ secrets.OPENROUTER_KEY }}
          GEMINI_KEY=${{ secrets.GEMINI_KEY }}
          ELEVENLABS_KEY=${{ secrets.ELEVENLABS_KEY }}
          VOICE_ID=${{ secrets.VOICE_ID }}
          WEATHER_KEY=${{ secrets.WEATHER_KEY }}
          EXCHANGE_KEY=${{ secrets.EXCHANGE_KEY }}
          DEEPSEEK_KEY=${{ secrets.DEEPSEEK_KEY }}
          GLM_KEY=${{ secrets.GLM_KEY }}
          MOONSHOT_KEY=${{ secrets.MOONSHOT_KEY }}
          QWEN_IMAGE_KEY=${{ secrets.QWEN_IMAGE_KEY }}
          LLAMA_KEY=${{ secrets.LLAMA_KEY }}
          EOF

      - name: Compilar APK Debug
        run: ./gradlew :app:assembleDebug

      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: Aura-DEBUG-APK
          path: app/build/outputs/apk/debug/app-debug.apk
